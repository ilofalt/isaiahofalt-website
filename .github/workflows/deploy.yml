name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write # required for OIDC federation to AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::522400670446:role/isaiahofalt-website-deploy
          aws-region: us-east-1

      - name: Sync to S3
        run: aws s3 sync out/ s3://isaiahofalt-com-site --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E3Q3ERIADEIO7C --paths "/*"
